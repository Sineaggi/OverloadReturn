buildscript {
  ext.versions = [
      'kotlin': '2.2.0-RC3',
  ]

  ext.deps = [
      'asm': 'org.ow2.asm:asm:9.8',
      'asmUtil': 'org.ow2.asm:asm-util:9.8',
      'kotlin': "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${versions.kotlin}",
      'clikt': 'com.github.ajalt:clikt:1.6.0',
      'junit': 'junit:junit:4.13.2',
      'compileTesting': 'com.google.testing.compile:compile-testing:0.21.0',
      'truth': 'com.google.truth:truth:1.4.4',
      'androidGradlePlugin': 'com.android.tools.build:gradle:3.2.1',
      'jimfs': 'com.google.jimfs:jimfs:1.3.0',
      'guava': 'com.google.guava:guava:33.4.8-jre',
  ]

  repositories {
    mavenCentral()
  }

  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${versions.kotlin}"
  }
}

subprojects {
  repositories {
    mavenCentral()
    google()
  }
}
